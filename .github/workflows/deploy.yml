name: CI/CD - testing.cybersoft.edu.vn

# Deploy (kèm build kiểm tra) chạy trên self-hosted runner đặt tại server Windows.
on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # Không dùng runner máy GitHub (ubuntu-latest) để khỏi tốn phút Actions dùng chung của tài khoản.
  # Kiểm tra (prisma generate + db push + next build) chạy ngay trong deploy/deploy.ps1 trên server;
  # build hỏng thì script khởi động lại service bằng bản build cũ.
  deploy:
    name: Deploy lên Windows/IIS (self-hosted)
    runs-on: [self-hosted, windows, testing]
    steps:
      - uses: actions/checkout@v4
      - name: Triển khai + restart service + health check
        shell: powershell
        run: .\deploy\deploy.ps1
